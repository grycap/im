tosca_definitions_version: tosca_simple_yaml_1_0

description: OSCAR KServe inference service example

imports:
  - oscar_custom_types: https://raw.githubusercontent.com/grycap/tosca/refs/heads/oscar_service/custom_types.yaml

topology_template:
  node_templates:
    qwen2-5-05b-instruct:
      type: tosca.nodes.oscar.Service
      properties:
        name: qwen2-5-05b-instruct
        type: llm_inference
        image: oci://ghcr.io/grycap/kserve-qwen2-5-05b-instruct:latest
        script: "-"
        runtime_image: ghcr.io/grycap/kserve-vllm-openai-cpu:v0.22.1
        args:
          - --dtype=auto
          - --enforce-eager
        cpu: 1.0
        memory: 1Gi
        env_variables:
          VLLM_CPU_KVCACHE_SPACE: "1"
          LOG_LEVEL: INFO
#      capabilities:
#        scalable:
#          properties:
#            min_instances: 1
#            max_instances: 3

  outputs:
    service_url:
      value: { get_attribute: [ qwen2-5-05b-instruct, endpoint ] }
    service_credentials:
      value: { get_attribute: [ qwen2-5-05b-instruct, credential ] }
